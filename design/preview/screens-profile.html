<!DOCTYPE html>
<html lang="en">

<body>
<div class="screens review">
<template>
  <div class="shot"><div class="cap">Profile</div>

        <div class="tile"><div class="k">Workouts · Nov</div><div class="v">7</div><div class="d down"><span class="i">arrow_downward</span>5 vs Oct (12)</div></div>
        <div class="tile"><div class="k">Time · Nov</div><div class="v">6<small>h</small> 12<small>m</small></div><div class="d down"><span class="i">arrow_downward</span>3 h 53 vs Oct</div></div>
      </div>
      <div class="overline" style="margin-top:6px">Latest records</div>
      <div><div class="pr-row"><div class="ic"><span class="i fill s18">trophy</span></div><div class="body"><div class="t">Leg press · heaviest</div><div class="s">10 Nov</div></div><div class="v">7 level × 12</div></div><div class="pr-row"><div class="ic"><span class="i fill s18">trophy</span></div><div class="body"><div class="t">Bench press · heaviest</div><div class="s">6 Nov</div></div><div class="v">42.5 kg × 10</div></div><div class="pr-row"><div class="ic"><span class="i fill s18">trophy</span></div><div class="body"><div class="t">Dips · most reps</div><div class="s">6 Nov</div></div><div class="v">16</div></div><div class="pr-row"><div class="ic"><span class="i fill s18">trophy</span></div><div class="body"><div class="t">Plank · longest hold</div><div class="s">1 Nov</div></div><div class="v">1:20</div></div></div>
    </div><nav class="navbar">
      <a><span class="ind"><span class="i">today</span></span>Today</a>
      <a><span class="ind"><span class="i">fitness_center</span></span>Program</a>
      <a><span class="ind"><span class="i">monitoring</span></span>Progress</a>
      <a class="on"><span class="ind"><span class="i">person</span></span>Profile</a>
    </nav>
    <div class="gesturebar" style="background:var(--csurface-container)"></div>
  </div></div>
  <div class="shot"><div class="cap">Bodyweight</div>
  <div class="phone" data-shot-suffix="bodyweight_default">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div><div class="appbar back"><button class="iconbtn"><span class="i">arrow_back</span></button><h1>Bodyweight</h1></div>

        <div class="range"><span>1M</span><span class="on">3M</span><span>6M</span><span>1Y</span><span>All</span></div>
      </div>
      <div>
        <div class="entry-row"><div class="body"><div class="t">78.4 kg</div><div class="s">Today 07:12</div></div><div class="d">−0.2</div><span class="i" style="color:var(--con-surface-variant);font-size:20px">more_vert</span></div><div class="entry-row"><div class="body"><div class="t">78.6 kg</div><div class="s">Thu 12 Nov · after holidays</div></div><div class="d">−0.4</div><span class="i" style="color:var(--con-surface-variant);font-size:20px">more_vert</span></div><div class="entry-row"><div class="body"><div class="t">79.0 kg</div><div class="s">Mon 9 Nov</div></div><div class="d">+0.1</div><span class="i" style="color:var(--con-surface-variant);font-size:20px">more_vert</span></div><div class="entry-row"><div class="body"><div class="t">78.9 kg</div><div class="s">Thu 5 Nov</div></div><div class="d">−0.3</div><span class="i" style="color:var(--con-surface-variant);font-size:20px">more_vert</span></div>
      </div>
    </div>
    <div class="fab-pos" style="bottom:40px"><button class="fab"><span class="i">add</span>Log weight</button></div><div class="gesturebar"></div>
  </div></div>
  <div class="shot"><div class="cap">Settings</div>
  <div class="phone" data-shot-suffix="settings_default">

    <div class="content" style="padding-top:0">
      <div class="section-label" style="margin-top:0">Appearance</div>
      <div class="list-tile"><span class="lead"><span class="i">contrast</span></span><div class="body"><div class="t">Theme</div></div></div>
      <div class="seg" style="margin:-4px 0 4px 40px"><span class="on"><span class="i">check</span>System</span><span>Light</span><span>Dark</span></div>
      <div class="section-label">Library</div>
      <div class="list-tile"><span class="lead"><span class="i">straighten</span></span><div class="body"><div class="t">Load units</div><div class="s">kg, level, plates</div></div><span class="trail">3 <span class="i">chevron_right</span></span></div>

      <div class="list-tile"><span class="lead"><span class="i">vibration</span></span><div class="body"><div class="t">Timer vibration</div></div><span class="trail"><span class="switch on"></span></span></div>
      <div class="list-tile"><span class="lead"><span class="i">light_mode</span></span><div class="body"><div class="t">Keep screen on</div><div class="s">During workouts</div></div><span class="trail"><span class="switch"></span></span></div>
      <div class="section-label">Streak</div>
      <div class="list-tile"><span class="lead"><span class="i">local_fire_department</span></span><div class="body"><div class="t">Weekly target</div><div class="s">Workouts per week</div></div><span class="trail"><span class="stepper-inline"><button><span class="i">remove</span></button><b>3</b><button><span class="i">add</span></button></span></span></div>
      <div class="section-label">About</div>
      <div class="list-tile"><span class="lead"><span class="i">info</span></span><div class="body"><div class="t">Version</div></div><span class="trail">1.0.0</span></div>
    </div><div class="gesturebar"></div>
  </div></div>
  <div class="shot"><div class="cap">Load units</div>
  <div class="phone" data-shot-suffix="load-units_default">

  </div></div>

      <div class="section-label">Library</div>
      <div class="list-tile"><span class="lead"><span class="i">straighten</span></span><div class="body"><div class="t">Load units</div><div class="s">kg, level, plates</div></div><span class="trail">3 <span class="i">chevron_right</span></span></div>
