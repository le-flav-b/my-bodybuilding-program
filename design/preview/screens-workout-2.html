<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screens · Workout: list view, swap, trophy, pause, summary</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screens review">
<template>
  <!-- ============ List view ============ -->
  <div class="shot"><div class="cap">Workout list view (exercise menu open)</div>
  <div class="phone" data-shot-suffix="workout-list_default">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div>
    <div class="p-head"><button class="iconbtn"><span class="i">arrow_back</span></button><div class="mid"><div class="t">Push A · exercises</div><div class="s">18:22 · 2 / 6 done</div></div><button class="iconbtn"><span class="i">pause</span></button></div>
    <div class="content" style="padding-top:4px;position:relative">
      <div class="ex-row"><div class="status done"><span class="i s18">check</span></div><div class="well" style="width:48px;height:48px"><img src="assets/img/bench_press.png" alt=""></div><div class="body"><div class="name">Bench press</div><div class="plan">4 / 4 sets</div></div><span class="i handle">drag_indicator</span></div>
      <div class="ex-row"><div class="status done"><span class="i s18">check</span></div><div class="well" style="width:48px;height:48px"><img src="assets/img/incline_dumbbell_press.png" alt=""></div><div class="body"><div class="name">Incline dumbbell press</div><div class="plan">3 / 3 sets</div></div><span class="i handle">drag_indicator</span></div>
      <div class="ex-row current"><div class="status now"><span class="i s18 fill">play_arrow</span></div><div class="well" style="width:48px;height:48px"><img src="assets/img/overhead_press.png" alt=""></div><div class="body"><div class="name">Overhead press</div><div class="plan">1 / 3 sets · in progress</div></div><button class="iconbtn" style="color:inherit"><span class="i">more_vert</span></button></div>
      <div class="ex-row"><div class="status todo"></div><div class="well" style="width:48px;height:48px"><img src="assets/img/dips.png" alt=""></div><div class="body"><div class="name">Dips</div><div class="plan">3 × max</div></div><span class="i handle">drag_indicator</span></div>
      <div class="ex-row"><div class="status todo"></div><div class="well" style="width:48px;height:48px"><img src="assets/img/dumbbell_fly.png" alt=""></div><div class="body"><div class="name">Dumbbell fly</div><div class="plan">3 × 12 · 10 kg</div></div><span class="i handle">drag_indicator</span></div>
      <div class="ex-row skipped"><div class="status skip"><span class="i s18">block</span></div><div class="well" style="width:48px;height:48px"><img src="assets/img/triceps_extension.png" alt=""></div><div class="body"><div class="name">Triceps extension</div><div class="plan">Skipped</div></div><span class="i handle">drag_indicator</span></div>
      <button class="btn text" style="margin-top:4px"><span class="i">add</span>Add exercise</button>
      <div class="menu" style="position:absolute;right:16px;top:206px;width:210px">
        <div class="it"><span class="i">play_arrow</span>Go to exercise</div>
        <div class="it"><span class="i">swap_horiz</span>Swap</div>
        <div class="it"><span class="i">block</span>Skip</div>
        <div class="it"><span class="i">straighten</span>Change unit</div>
        <div class="sep"></div>
        <div class="it" style="color:var(--cerror)"><span class="i" style="color:var(--cerror)">delete</span>Remove</div>
      </div>
    </div>
    <div class="actionbar"><button class="btn big filled block"><span class="i">flag</span>Finish workout</button></div>
    <div class="gesturebar"></div>
  </div></div>

  <!-- ============ Swap sheet ============ -->
  <div class="shot"><div class="cap">Swap exercise (picker over the list)</div>
  <div class="phone" data-shot-suffix="workout-list_swap">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div>
    <div class="p-head"><button class="iconbtn"><span class="i">arrow_back</span></button><div class="mid"><div class="t">Push A · exercises</div><div class="s">18:22 · 2 / 6 done</div></div><button class="iconbtn"><span class="i">pause</span></button></div>
    <div class="scrim-over"></div>
    <div class="bottom sheet" style="height:820px">
      <div class="grab"></div>
      <div class="hrow" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0">Swap exercise</h2><button class="btn text"><span class="i">add</span>New</button></div>
      <p class="spec-n" style="margin:0 0 12px">Replacing <b>Overhead press</b>. Sets already logged stay on it.</p>
      <div class="search"><span class="i">search</span><span class="grow">Search exercises</span></div>
      <div class="chips" style="margin:12px 0 4px;flex-wrap:nowrap;overflow:hidden">
        <span class="chip on"><span class="i">check</span>Shoulders</span><span class="chip">Chest</span><span class="chip">Triceps</span><span class="chip">Back</span><span class="chip">Legs</span>
      </div>
      <div class="ex-row"><div class="well" style="width:56px;height:56px"><img src="assets/img/overhead_press.png" alt=""></div><div class="body"><div class="name">Seated dumbbell press</div><div class="last" style="font-size:14px;line-height:20px">Shoulders · Triceps</div></div></div>
      <div class="ex-row"><div class="well ph" data-muscle="Shoulders" style="width:56px;height:56px"><img src="assets/img/placeholder_chest.png" alt=""></div><div class="body"><div class="name">Machine shoulder press</div><div class="last" style="font-size:14px;line-height:20px">Shoulders · Triceps</div></div></div>
      <div class="ex-row"><div class="well ph" data-muscle="Shoulders" style="width:56px;height:56px"><img src="assets/img/placeholder_chest.png" alt=""></div><div class="body"><div class="name">Lateral raise</div><div class="last" style="font-size:14px;line-height:20px">Shoulders</div></div></div>
      <div class="ex-row"><div class="well" style="width:56px;height:56px"><img src="assets/img/barbell_row.png" alt=""></div><div class="body"><div class="name">Upright row</div><div class="last" style="font-size:14px;line-height:20px">Shoulders · Traps</div></div></div>
      <div class="ex-row"><div class="well" style="width:56px;height:56px"><img src="assets/img/dumbbell_fly.png" alt=""></div><div class="body"><div class="name">Reverse fly</div><div class="last" style="font-size:14px;line-height:20px">Shoulders · Upper back</div></div></div>
    </div>
  </div></div>

  <!-- ============ Trophy over the player ============ -->
  <div class="shot"><div class="cap">PR trophy moment (over the player)</div>
  <div class="phone" data-shot-suffix="player_trophy">
    <div class="trophy" style="position:absolute;inset:0;justify-content:center;padding-bottom:80px">
      <img src="assets/img/trophy.png" alt="" style="width:260px">
      <div class="k">New record</div>
      <div class="v">42.5 kg × 10</div>
      <div class="s">Bench press · heaviest load</div>
      <div class="was">Previous: 40 kg (12 Oct)</div>
      <button class="btn big filled" style="background:var(--ctrophy);color:#181B1E;min-width:220px">Nice!</button>
      <div style="position:absolute;left:16px;right:16px;bottom:40px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 16px;color:#EEEEEE;font:500 14px Inter">
        <span class="i" style="color:var(--cbrand)">timer</span><span style="flex:1">Rest running</span><b style="font-variant-numeric:tabular-nums;font-size:18px">1:24</b>
      </div>
    </div>
  </div></div>

  <!-- ============ Paused ============ -->
  <div class="shot"><div class="cap">Player · paused</div>
  <div class="phone" data-shot-suffix="player_paused">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div>
    <div class="p-head"><button class="iconbtn"><span class="i">close</span></button><div class="mid"><div class="t">Push A</div><div class="s">18:22 · ~38 min left</div></div><button class="iconbtn"><span class="i">pause</span></button><button class="iconbtn"><span class="i">view_list</span></button></div>
    <div class="content"><div class="p-ex"><div class="well"><img src="assets/img/overhead_press.png" alt=""></div><div class="body"><div class="k">Exercise 3 / 6</div><h2>Overhead press</h2></div></div></div>
    <div class="paused">
      <div class="ic"><span class="i s40 fill">pause</span></div>
      <div class="k">Paused</div>
      <div class="clock">18:22</div>
      <div class="s">Workout clock and rest timer are frozen.<br>Overhead press · set 2 of 3 next</div>
      <button class="btn big filled" style="min-width:240px"><span class="i fill">play_arrow</span>Resume</button>
      <div class="hrow" style="justify-content:center;margin-top:8px">
        <button class="btn text"><span class="i">flag</span>Finish</button>
        <button class="btn text danger">Discard</button>
      </div>
    </div>
  </div></div>

  <!-- ============ Summary + update prompt ============ -->
  <div class="shot"><div class="cap">Summary · update-program prompt</div>
  <div class="phone" data-shot-suffix="summary_update-prompt">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div>
    <div class="content" style="padding-top:24px">
      <div class="sum-hero"><div class="k">Workout complete</div><h2>Push A</h2><div class="s">Sunday 15 Nov · 18:04 – 19:01</div></div>
    </div>
    <div class="scrim-over" style="display:flex;align-items:center;justify-content:center;padding:24px">
      <div class="dialog" style="position:relative">
        <h2>Update the program?</h2>
        <p style="margin-bottom:12px">You changed Push A during this workout:</p>
        <ul class="changes">
          <li><span class="i">swap_horiz</span>Overhead press → Seated dumbbell press</li>
          <li><span class="i">block</span>Skipped Triceps extension (kept in the program)</li>
          <li><span class="i">edit</span>Bench press: 40 → 42.5 kg</li>
        </ul>
        <div class="acts"><button class="btn text">No, keep it</button><button class="btn filled">Update</button></div>
      </div>
    </div>
  </div></div>

  <!-- ============ Summary ============ -->
  <div class="shot"><div class="cap">Workout summary</div>
  <div class="phone" data-shot-suffix="summary_default">
    <div class="statusbar"><span>9:41</span><span><span class="i">signal_cellular_alt</span> <span class="i">wifi</span> <span class="i">battery_full</span></span></div>
    <div class="content stack" style="padding-top:24px;gap:16px">
      <div class="sum-hero" style="padding-bottom:0"><div class="k">Workout complete</div><h2>Push A</h2><div class="s">Sunday 15 Nov · 18:04 – 19:01</div></div>
      <div class="tiles three">
        <div class="tile"><div class="k">Duration</div><div class="v">52:10</div></div>
        <div class="tile"><div class="k">Sets</div><div class="v">18</div></div>
        <div class="tile"><div class="k">Exercises</div><div class="v">5 / 6</div></div>
      </div>
      <div class="overline">New records · 2</div>
      <div class="pr-list">
        <div class="pr-item"><div class="ic"><span class="i fill s20">trophy</span></div><div class="body"><div class="t">Bench press · heaviest load</div><div class="s">42.5 kg × 10 · was 40 kg</div></div></div>
        <div class="pr-item"><div class="ic"><span class="i fill s20">trophy</span></div><div class="body"><div class="t">Dips · most reps</div><div class="s">16 reps · was 14</div></div></div>
      </div>
      <div class="textarea" style="margin-top:8px"><label>Workout note</label>Felt strong, shoulder OK.</div>
      <div class="info-line"><span class="i">skip_next</span>Next session: <b style="color:var(--con-surface)">Legs</b></div>
    </div>
    <div class="actionbar"><button class="btn big filled block"><span class="i">check</span>Done</button></div>
    <div class="gesturebar"></div>
  </div></div>
</template>
<section data-theme="light"></section>
<section data-theme="dark"></section>
</div>
<script src="review.js"></script>
</body>
</html>
