name: Release APK

# Builds a signed release APK. Runs when a version tag (v1.0.0) is pushed, or
# by hand from the Actions tab. Needs these repository secrets:
#   RELEASE_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_ALIAS          key alias
#   RELEASE_KEY_PASSWORD       key password
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Restore the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (see the header of this workflow)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build the release APK
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          name="my-bodybuilding-program-$version.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --clobber

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
