name: my_bodybuilding_program
description: "Plan training, guide workouts set by set, track progress."
publish_to: 'none'
version: 1.0.4+10

environment:
  sdk: ^3.14.0

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/seed/catalogue.json
    - assets/seed/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: Kameron
      fonts:
        - asset: assets/fonts/Kameron-Bold.ttf
          weight: 700
